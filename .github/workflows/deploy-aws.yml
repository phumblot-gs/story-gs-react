name: Deploy Storybook to AWS

# Construit l'image Storybook (arm64), la pousse dans ECR, puis la déploie sur
# l'instance EC2 via SSM Run Command. Aucune clé AWS stockée : GitHub obtient
# un rôle temporaire par OIDC, limité à la branche latest.
#
# Secrets du dépôt : AWS_DEPLOY_ROLE_ARN, AWS_INSTANCE_ID, NPM_NEXUS_AUTH.
# Variable du dépôt : AWS_DEPLOY_ENABLED=true active le déploiement à chaque
# push (sinon, lancement manuel uniquement).

on:
  push:
    branches:
      - latest
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: gs-components-library-storybook

jobs:
  deploy:
    name: Deploy Storybook to AWS
    if: github.ref == 'refs/heads/latest' && (vars.AWS_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          secrets: |
            NPM_NEXUS_AUTH=${{ secrets.NPM_NEXUS_AUTH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2 (SSM)
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/aws
        run: |
          set -euo pipefail
          # Fichiers de déploiement de ce commit, puis deploy.sh (secrets lus sur l'instance dans SSM).
          PARAMS=$(jq -n --arg raw "$RAW_BASE" --arg image "$IMAGE" '{commands: [
            "set -euo pipefail",
            "mkdir -p /opt/gs-storybook && cd /opt/gs-storybook",
            ("for f in docker-compose.yml Caddyfile deploy.sh; do curl -fsSL \"" + $raw + "/$f\" -o \"$f.new\" && mv \"$f.new\" \"$f\"; done"),
            ("bash deploy.sh \"" + $image + "\"")
          ], executionTimeout: ["900"]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "storybook ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          # Attente du résultat (jusqu'à 15 min).
          for _ in $(seq 1 180); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Statut : $STATUS"
          [ "$STATUS" = "Success" ]
